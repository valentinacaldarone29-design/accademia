<title>Accademia dei Talenti</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Cinzel+Decorative:wght@700;900&family=Open+Sans:wght@500;700;800&display=swap">
<style>
/* Layout: stessa identità delle altre app di classe. Pannelli colorati arrotondati, griglia di avatar in bolla chiara, scheda alunno con fascia colorata e curva. */
:root{
  --bg:#F6F5F3; --surface:#FFFFFF; --ink:#1F3A56; --muted:#546B82; --line:#D3DCE3; --edge:#1F3A56;
  --sea:#4B97AB; --sea-soft:#D9EDF2; --on-sea:#FFFFFF;
  --accent:#D2325F; --on-accent:#FFFFFF;
  --orange:#DD9433; --green:#6FB67F; --sun:#F2C230;
  --good:#2E8B57; --bad:#D8453D;
  --mc:var(--sea);
  --font-display:'Delius Unicase','Chewy','Trebuchet MS',system-ui,sans-serif;
  --font-body:'Open Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#15232F; --surface:#1D3345; --ink:#EEF3F6; --muted:#A5BBCA; --line:#35516A; --edge:#6C8DA6;
    --sea:#5FB3C6; --sea-soft:#22485A; --on-sea:#0F2230;
    --accent:#F0577F; --orange:#E3A04A; --green:#7CC48B; --sun:#F2CB45;
    --good:#5BC98A; --bad:#FF7B6E; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#15232F; --surface:#1D3345; --ink:#EEF3F6; --muted:#A5BBCA; --line:#35516A; --edge:#6C8DA6;
  --sea:#5FB3C6; --sea-soft:#22485A; --on-sea:#0F2230;
  --accent:#F0577F; --orange:#E3A04A; --green:#7CC48B; --sun:#F2CB45;
  --good:#5BC98A; --bad:#FF7B6E; color-scheme:dark;
}
*{box-sizing:border-box}
body{
  background:var(--bg); color:var(--ink);
  font:500 17px/1.55 var(--font-body);
  padding-block:20px 56px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
.wrap{max-width:820px;margin:0 auto}
button,a{-webkit-tap-highlight-color:transparent}
button{font-family:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1{font:700 clamp(30px,8.5vw,44px)/1.05 var(--font-display);margin:8px 0 0;text-wrap:balance}
h2{font:700 clamp(26px,7vw,36px)/1.15 var(--font-display);margin:0;text-wrap:balance}
h3{font:700 21px/1.2 var(--font-display);margin:0}
p{margin:0}
.eyebrow{font:700 12px/1 var(--font-body);letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:20px}
.top > div{min-width:0}
.pill{flex:none;display:flex;align-items:center;gap:6px;background:var(--surface);border:2px solid var(--edge);border-radius:999px;padding:6px 14px;font:700 20px/1 var(--font-display);font-variant-numeric:tabular-nums}
.pill b{color:var(--sun);font-size:22px;-webkit-text-stroke:1px var(--edge)}
.sec{font:700 13px/1 var(--font-body);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:0 0 10px}
.note{font-size:14px;color:var(--muted);margin-top:14px;text-align:center}
.warn{background:var(--sea-soft);border:2px solid var(--sea);border-radius:16px;padding:10px 14px;margin-bottom:14px;font-weight:700;font-size:15px}

/* bottoni */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:9px 20px;border-radius:999px;border:2px solid var(--edge);background:var(--surface);color:var(--ink);font:700 17px/1 var(--font-display);cursor:pointer;text-decoration:none}
@media (hover:hover){.btn:hover{border-color:var(--accent)}}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.sm{min-height:40px;padding:6px 14px;font-size:15px}
.btn.danger{border-color:var(--bad);color:var(--bad)}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.row.c{justify-content:center}

/* home classe */
.hero{background:var(--sea);color:#fff;border-radius:24px;padding:22px}
.hero h2{color:#fff;line-height:1.2}
.hero p{margin-top:8px;font-weight:700;font-size:17px;line-height:1.4}
.goal{margin-top:16px;background:rgba(255,255,255,.2);border-radius:16px;padding:12px 14px}
.goal .t{display:flex;justify-content:space-between;gap:10px;font:700 16px/1.3 var(--font-body);flex-wrap:wrap}
.goal .bar{margin-top:8px;background:rgba(255,255,255,.35)}
.bar{height:12px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:var(--orange);transition:width .5s}
.goal .bar i{background:var(--sun)}
.tools{display:flex;flex-wrap:wrap;gap:10px;margin:18px 0}
.selpanel{background:var(--surface);border:2px solid var(--edge);border-radius:20px;padding:14px;margin-bottom:16px}
.selpanel select{min-height:44px;border-radius:12px;border:2px solid var(--edge);background:var(--surface);color:var(--ink);font:700 16px var(--font-body);padding:6px 10px;max-width:100%}
.amts{display:flex;gap:8px;flex-wrap:wrap}
.amts button{min-width:62px;min-height:52px;border-radius:16px;border:2px solid var(--edge);background:var(--sea-soft);font:700 22px/1 var(--font-display);cursor:pointer}
.amts button:hover{background:var(--sun)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.attpanel{background:var(--surface);border:2px solid var(--edge);border-radius:22px;padding:16px;margin-bottom:16px}
.attk{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:6px 0 12px}
.attk button{display:flex;align-items:center;gap:8px;min-height:56px;padding:6px 12px;border-radius:16px;border:2px solid var(--line);background:var(--surface);font:700 16px/1.1 var(--font-body);cursor:pointer;text-align:left}
.attk button span{font-size:26px}
.attk button[aria-pressed="true"]{border-color:var(--accent);background:var(--sea-soft);box-shadow:0 0 0 3px var(--accent)}
.attd{color:var(--muted);margin:0 0 10px}
@media (max-width:560px){.attk{grid-template-columns:repeat(2,minmax(0,1fr))}}
.attg{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:10px}
.ac{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 6px 10px;border-radius:18px;border:2px solid var(--edge);background:var(--surface);cursor:pointer;min-width:0;touch-action:manipulation}
.ac:active{transform:scale(.97);background:var(--sun)}
.ac .avw{width:100%;max-width:84px}
.ac strong{font-size:15px;overflow:hidden;text-overflow:ellipsis;max-width:100%;white-space:nowrap}
.ac .n{position:absolute;top:6px;right:6px;min-width:34px;padding:3px 7px;border-radius:99px;background:var(--accent);color:#fff;font:700 15px/1.2 var(--font-display)}
.ac.pop .n{animation:attpop .5s}
@keyframes attpop{40%{transform:scale(1.5)}}
.attrows{display:grid;gap:8px}
.attrow{display:grid;grid-template-columns:34px 1fr auto auto;gap:10px;align-items:center;padding:8px 10px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface2,#f6f8fb)}
.attrow>span{font-size:24px}.attrow small{display:block;color:var(--muted);font-weight:400}
.attrow b.v{font:700 22px/1 var(--font-display);min-width:2.2ch;text-align:right}
.attrow .amts button{min-width:52px;min-height:46px;font-size:18px}
.chk{display:flex;gap:10px;align-items:center;font-weight:700;margin-top:10px;cursor:pointer}.chk input{width:24px;height:24px}
.pc{display:flex;flex-direction:column;align-items:center;gap:4px;padding:12px 10px 14px;background:var(--surface);border:2px solid var(--edge);border-radius:22px;cursor:pointer;text-align:center;position:relative;min-width:0}
@media (hover:hover){.pc:hover{transform:translateY(-3px)}}
.pc[aria-pressed="true"]{background:var(--sea-soft);border-color:var(--accent);box-shadow:0 0 0 3px var(--accent)}
.pc .avw{width:100%;max-width:124px}
.pc strong{font:700 20px/1.1 var(--font-display);overflow-wrap:anywhere}
.stg{font:800 12px/1 var(--font-body);letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.pc .bar{width:100%;height:9px;margin-top:4px}
.pc small{font:700 13px/1.2 var(--font-body);color:var(--muted);font-variant-numeric:tabular-nums}
.ex{position:absolute;top:8px;right:8px;font:800 10px/1 var(--font-body);letter-spacing:.06em;text-transform:uppercase;background:var(--sun);color:#1F3A56;border-radius:99px;padding:4px 7px}
.av{display:block;width:100%;height:auto}
.empty{background:var(--surface);border:2px dashed var(--edge);border-radius:22px;padding:28px 20px;text-align:center}
.empty p{color:var(--muted);margin:8px auto 16px;max-width:42ch}

/* form */
.panel{background:var(--surface);border:2px solid var(--edge);border-radius:22px;padding:18px;margin-bottom:16px}
label.l{display:block;font:700 14px/1.2 var(--font-body);color:var(--muted);margin:12px 0 6px}
input[type=text],textarea{width:100%;min-height:46px;border-radius:14px;border:2px solid var(--edge);background:var(--surface);color:var(--ink);font:600 17px var(--font-body);padding:8px 12px}
textarea{min-height:110px;resize:vertical}
.opts{display:flex;flex-wrap:wrap;gap:10px}
.opt{width:76px;padding:6px;border-radius:18px;border:2px solid var(--line);background:var(--surface);cursor:pointer;text-align:center}
.opt:disabled{opacity:.4;cursor:default}
.opt[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.opt small{display:block;font:700 12px/1.2 var(--font-body);color:var(--muted);margin-top:2px}
.sw{width:44px;height:44px;border-radius:50%;border:3px solid var(--edge);cursor:pointer;padding:0}
.sw[aria-pressed="true"]{box-shadow:0 0 0 3px var(--surface),0 0 0 6px var(--accent)}

/* scheda alunno */
.back{display:inline-flex;align-items:center;gap:6px;min-height:44px;color:var(--accent);font-weight:800;text-decoration:none;margin-bottom:6px}
.mp{background:var(--surface);border:2px solid var(--edge);border-radius:22px;overflow:hidden;margin-bottom:16px}
.mband{background:var(--mc);color:#fff;padding:20px 18px 32px;text-align:center;border-radius:0 0 50% 50% / 0 0 30px 30px}
.mband h2{color:#fff}
.mband .stg{color:#fff;opacity:.95;display:block;margin-top:6px;font-size:13px}
.mbody{padding:0 18px 22px}
.big{width:min(100%,280px);margin:-18px auto 0;position:relative}
.xpline{text-align:center;font:700 18px/1.3 var(--font-display);margin-top:6px}
.mbody .bar{height:14px;margin:10px auto 0;max-width:420px}
.mbody .need{text-align:center;color:var(--muted);font-size:15px;margin-top:6px}
.subj{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.sj{min-height:44px;padding:6px 14px;border-radius:99px;border:2px solid var(--line);background:var(--surface);font:700 15px/1.1 var(--font-body);cursor:pointer;display:inline-flex;align-items:center;gap:8px}
.sj i{width:12px;height:12px;border-radius:50%;background:var(--c)}
.sj[aria-pressed="true"]{border-color:var(--c);background:var(--sea-soft);box-shadow:0 0 0 2px var(--c)}
.skills{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.sk{border:2px solid var(--line);border-radius:16px;padding:10px 12px}
.sk.on{border-color:var(--green);background:var(--sea-soft)}
.sk b{font:700 17px/1.2 var(--font-display);display:flex;justify-content:space-between;gap:8px}
.sk .bar{height:8px;margin:6px 0 4px}
.sk .bar i{background:var(--c)}
.sk small{font-size:13px;color:var(--muted);font-weight:700}
.path{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}.path.p7{grid-template-columns:repeat(7,1fr)}@media (max-width:640px){.path.p7{grid-template-columns:repeat(4,1fr)}}
.path div{text-align:center;min-width:0}
.path .av{max-width:96px;margin:0 auto}
.path .lk .av{filter:brightness(0);opacity:.22}
.path small{display:block;overflow-wrap:anywhere;font:800 11px/1.25 var(--font-body);letter-spacing:0;text-transform:uppercase;color:var(--muted);margin-top:2px}
.path .cur small{color:var(--accent)}
.log{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;font-size:15px}
.log li{display:flex;justify-content:space-between;gap:10px;border-bottom:1px dashed var(--line);padding-bottom:5px}
.log b{color:var(--good);font-variant-numeric:tabular-nums}
details.teacher{margin-top:6px;border:2px dashed var(--edge);border-radius:18px;padding:4px 16px;background:var(--surface);margin-bottom:12px}
details.teacher summary{min-height:44px;display:flex;align-items:center;cursor:pointer;font-weight:800;color:var(--accent)}
details.teacher div{padding:0 0 14px;color:var(--muted);font-size:16px}
details.teacher div p + p{margin-top:8px}
details.teacher select{min-height:44px;border-radius:12px;border:2px solid var(--edge);background:var(--surface);color:var(--ink);font:700 16px var(--font-body);padding:6px 10px}

/* evoluzione */
.ov{position:fixed;inset:0;z-index:20;background:rgba(16,32,46,.78);display:grid;place-items:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.ov[hidden]{display:none}
.ovc{width:min(100%,460px);max-height:100%;overflow:auto;background:var(--surface);border:3px solid var(--edge);border-radius:26px;padding:22px 18px;text-align:center}
.ovc h2{color:var(--accent)}
.evo{display:flex;align-items:center;justify-content:center;gap:6px;margin:10px 0}
.evo .a{width:34%;filter:grayscale(1);opacity:.55}
.evo .arr{font:700 34px/1 var(--font-display);color:var(--accent)}
.evo .b{width:52%;animation:pop .8s cubic-bezier(.3,1.6,.5,1)}
.ovc p{color:var(--muted)}
.ovc .rito{margin:12px 0 16px;padding:10px 12px;border-radius:16px;background:var(--sea-soft);color:var(--ink);font-size:15px;text-align:left}
@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}
.toast{position:fixed;left:50%;bottom:max(20px,env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:30;background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:99px;font-weight:700;font-size:15px;max-width:calc(100% - 32px);text-align:center}
.toast[hidden]{display:none}
/* portale */
/* tablet e touch */
html{-webkit-text-size-adjust:100%}
button,a,input,select,label,summary,[role=button],[data-act]{touch-action:manipulation}
button,.btn,.tab,.pill,.opt,.chip,.gcard,.cmd,.tile,.pslot,.pdrag{-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
@media (min-width:1000px){
  .wrap{max-width:1120px}
  .me-grid{display:grid;grid-template-columns:minmax(360px,420px) 1fr;gap:18px;align-items:start}
  .me-grid>.me-l{position:sticky;top:12px}
  .grid{grid-template-columns:repeat(auto-fill,minmax(170px,1fr))}
}
@media (min-width:700px) and (hover:none){.btn{min-height:52px}.amts button{min-width:70px;min-height:58px}.wd{padding:12px}}
.fsbtn{margin-left:8px}

.login{max-width:520px;margin:0 auto}
.login .hero{text-align:center}
.codein{min-height:64px;border-radius:18px;border:3px solid var(--edge);padding:6px 14px;font:800 30px 'Courier New',monospace;letter-spacing:3px;text-transform:uppercase;text-align:center;color:var(--ink);background:var(--surface);width:100%}
.err{min-height:1.4em;color:var(--bad);font-weight:800;margin-top:8px}
.hello{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.hello b{font:700 22px/1.2 var(--font-display)}
.wardrobe{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.wd{display:grid;justify-items:center;gap:4px;padding:10px 8px;border-radius:18px;border:2px solid var(--line);background:var(--surface);cursor:pointer;text-align:center;font:700 14px/1.2 var(--font-body)}
.wd[aria-pressed="true"]{border-color:var(--c);box-shadow:0 0 0 3px var(--c)}
.wd .wdav{width:90px}
.wd small{color:var(--muted);font-size:12px}
.pows{display:grid;gap:10px}
.pw{display:grid;grid-template-columns:48px 1fr;gap:12px;align-items:center;padding:10px 12px;border-radius:16px;border:2px solid var(--c);background:var(--sea-soft)}
.pw.lk{border-style:dashed;border-color:var(--line);background:transparent;opacity:.75}
.pw i{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:var(--c);border:2px solid #fff;box-shadow:0 0 0 1.5px var(--edge)}
.pw i svg{width:64%;height:64%}
.pw b{display:block;font:700 18px/1.2 var(--font-display)}

function attPeriod(k){
  var now=new Date(),y=now.getMonth()>=8?now.getFullYear():now.getFullYear()-1;
  if(k==="q1")return {n:"1° quadrimestre",from:+new Date(y,8,1),to:+new Date(y+1,1,1)};
  if(k==="q2")return {n:"2° quadrimestre",from:+new Date(y+1,1,1),to:+new Date(y+1,6,1)};
  if(k==="mese")return {n:"questo mese",from:+new Date(now.getFullYear(),now.getMonth(),1),to:Infinity};
  if(k==="sett"){var d=new Date(now.getFullYear(),now.getMonth(),now.getDate());d.setDate(d.getDate()-((d.getDay()+6)%7));return {n:"questa settimana",from:+d,to:Infinity}}
  return {n:"tutto l'anno",from:0,to:Infinity};
}

  var tz=h==="maestra"||h==="codici"||h==="risultati"||h==="backup"||h==="maestre"||h.indexOf("a-")===0||h.indexOf("am-")===0||h.indexOf("cm-")===0||h==="alunni";
